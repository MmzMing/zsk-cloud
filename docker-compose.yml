version: '3.8'

services:
  zsk-gateway:
    build:
      context: .
      dockerfile: zsk-gateway/Dockerfile
    container_name: zsk-gateway
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - zsk-network

  zsk-auth:
    build:
      context: .
      dockerfile: zsk-auth/Dockerfile
    container_name: zsk-auth
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    ports:
      - "10010:10010"
    restart: unless-stopped
    networks:
      - zsk-network

  zsk-module-system:
    build:
      context: .
      dockerfile: zsk-module/zsk-module-system/Dockerfile
    container_name: zsk-module-system
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    ports:
      - "20010:20010"
    restart: unless-stopped
    networks:
      - zsk-network

  zsk-module-document:
    build:
      context: .
      dockerfile: zsk-module/zsk-module-document/Dockerfile
    container_name: zsk-module-document
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    ports:
      - "20020:20020"
    restart: unless-stopped
    networks:
      - zsk-network

networks:
  zsk-network:
    driver: bridge
