# 网关配置
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
          routes:
            # 认证中心
            - id: zsk-auth
              uri: lb://zsk-auth
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            # 系统模块
            - id: zsk-module-system
              uri: lb://zsk-module-system
              predicates:
                - Path=/api/system/**
              filters:
                - StripPrefix=1
            # 文档模块
            - id: zsk-module-document
              uri: lb://zsk-module-document
              predicates:
                - Path=/api/document/**
              filters:
                - StripPrefix=1
security:
  # =============================================
  # XSS 跨站脚本攻击防护配置
  # =============================================
  xss:
    # 总开关：false 时跳过所有 XSS 过滤逻辑
    enabled: true
    # Body 过滤开关：true 时清洗 POST/PUT 等请求体中的 JSON/XML 数据
    body-enabled: true
    # 需要过滤的 Content-Type 白名单（不在列表中的类型不处理）
    body-content-types:
      - application/json
      - application/xml
      - text/xml
    # Body 最大读取字节数（默认 1MB），防止超大请求体导致 OOM
    body-max-bytes: 5048576
    # 排除路径（支持 Ant 风格），匹配的路径不进行 XSS 过滤
    exclude-urls:
      # 认证服务：登录/注册/第三方回调等接口不需要 XSS 过滤（可能包含特殊字符）
      - /api/auth/**
      - /api/document/docNoteDtlAggregate/**
  # =============================================
  # 安全配置 (白名单)
  ignore:
    whites:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/logout
      - /api/auth/captcha
      - /api/auth/captcha/check
      - /api/auth/public-key
      - /api/auth/email/code/**
      - /api/auth/magic-link/**
      - /api/auth/third-party/**
      - /api/auth/github/callback
      - /api/auth/wechat/callback
      - /api/auth/qq/callback
      - /api/auth/test/hello
      - /api/system/user/info/*
      - /doc.html
      - /swagger-ui/**
      - /swagger-resources/**
      - /v3/api-docs/**
      - /**/v3/api-docs/**
      - /**/v3/api-docs
      - /webjars/**
      - /v3/api-docs/swagger-config
      - /favicon.ico